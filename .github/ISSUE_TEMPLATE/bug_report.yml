name: 基础版问题反馈
description: 反馈 MaaUma 普通版的问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        此表单提交的 Issue、截图和错误片段会**公开可见**。

        在 GitHub 提交需要先登录 GitHub 账号。

        请勿提交账号、密码、密钥及个人信息。截图和错误片段请先遮挡这些信息，也不要直接上传完整日志或配置目录。
  - type: input
    id: version
    attributes:
      label: MaaUma 版本
      description: 请填写发生问题时使用的版本；自行构建请同时填写提交号（如有）。
      placeholder: "例如：0.4.6；或版本 + 提交号"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请写出从打开程序到出现问题的操作步骤；无法稳定复现可直接写“偶发/步骤不明”。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现（可选）
      description: 你原本预期程序会怎样工作？
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 程序实际发生了什么？如有错误提示，可在下方提供经过遮挡的相关片段。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境（可选）
      description: 不涉及模拟器时可注明“不涉及”；请勿填写账号、密码、密钥及个人信息。
      placeholder: |
        操作系统及版本：
        模拟器名称及版本（若相关）：
        程序来源：发布安装包 / 自行构建
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选）
      description: 可粘贴或拖入截图。提交前请遮挡账号、密码、密钥及个人信息；截图会公开可见。
    validations:
      required: false
  - type: textarea
    id: error-excerpt
    attributes:
      label: 经过遮挡的错误片段（可选）
      description: 仅粘贴与问题相关且已去除账号、密码、密钥及个人信息的片段，无需添加代码围栏；请勿上传完整日志或配置文件。
      render: text
    validations:
      required: false
